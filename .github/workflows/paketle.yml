name: Windows Icin Paketleri Indir

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Dosyalari Al
        uses: actions/checkout@v4

      - name: Node.js 26 Kur
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Windows Paketlerini ve Onbellegi Indir
        run: |
          npm install --cache ./npm-cache --legacy-peer-deps

      - name: Dosyalari ZIP Olarak Sikistir
        run: |
          Compress-Archive -Path node_modules, npm-cache, package-lock.json -DestinationPath windows-offline-paketler.zip

      - name: Indirilebilir Dosya Olustur
        uses: actions/upload-artifact@v4
        with:
          name: windows-openclaude-n8n
          path: windows-offline-paketler.zip
